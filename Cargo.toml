[package]
name = "VOS"
version = "0.1.0"
edition = "2024"
authors = ["vritik246800"]
description = "VOS — Visual OS Shell: TUI como camada intermédia entre CLI e GUI"

[[bin]]
name = "VOS"
path = "src/main.rs"

[dependencies]
ratatui        = "0.29"
crossterm      = { version = "0.28", features = ["event-stream"] }
anyhow         = "1.0"
thiserror      = "2.0"
serde          = { version = "1.0", features = ["derive"] }
toml           = "0.8"
rusqlite       = { version = "0.32", features = ["bundled"] }
tokio          = { version = "1", features = ["full"] }
rodio          = "0.17"
sysinfo        = "0.33"
fuzzy-matcher  = "0.3"
syntect        = "5"
notify         = "7"
unicode-width  = "0.2"
chrono         = { version = "0.4", features = ["serde"] }
futures        = "0.3"
image          = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
base64         = "0.22"
pulldown-cmark = "0.9"
nerd-font-symbols = "0.3.0"
nerdicons_rs = "0.1.0"
lofty = "0.22"
reqwest        = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json     = "1"
